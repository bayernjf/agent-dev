<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .favicon-border { stroke: transparent; }
    @media (prefers-color-scheme: dark) {
      .favicon-border { stroke: #7A8695; }
    }
  </style>
  <defs>
    <linearGradient id="adBg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e2a5a"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="adInk" x1="9" y1="3" x2="23" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <!-- 中心镂空：齿轮填充后挖出圆孔透出底色 -->
    <mask id="adHole">
      <rect width="32" height="32" fill="white"/>
      <circle cx="16" cy="16" r="7.2" fill="black"/>
    </mask>
  </defs>

  <!-- 外框：圆角矩形，深海军蓝渐变底 -->
  <rect width="32" height="32" rx="7" fill="url(#adBg)"/>
  <!-- 深色模式下增加浅色描边，提升辨识度 -->
  <rect class="favicon-border" x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke-width="1"/>

  <!-- 实体齿轮：圆盘 + 8 个宽齿，占满方形区域 -->
  <g fill="url(#adInk)" mask="url(#adHole)">
    <circle cx="16" cy="16" r="9.4"/>
    <rect x="14.3" y="3.4" width="3.4" height="4.4" rx="1.2"/>
    <rect x="14.3" y="3.4" width="3.4" height="4.4" rx="1.2" transform="rotate(45 16 16)"/>
    <rect x="14.3" y="3.4" width="3.4" height="4.4" rx="1.2" transform="rotate(90 16 16)"/>
    <rect x="14.3" y="3.4" width="3.4" height="4.4" rx="1.2" transform="rotate(135 16 16)"/>
    <rect x="14.3" y="3.4" width="3.4" height="4.4" rx="1.2" transform="rotate(180 16 16)"/>
    <rect x="14.3" y="3.4" width="3.4" height="4.4" rx="1.2" transform="rotate(225 16 16)"/>
    <rect x="14.3" y="3.4" width="3.4" height="4.4" rx="1.2" transform="rotate(270 16 16)"/>
    <rect x="14.3" y="3.4" width="3.4" height="4.4" rx="1.2" transform="rotate(315 16 16)"/>
  </g>

  <!-- 中心代码符号 </>，等比放大 -->
  <path d="M12.6 12.6 L9.6 16 L12.6 19.4" fill="none" stroke="url(#adInk)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M19.4 12.6 L22.4 16 L19.4 19.4" fill="none" stroke="url(#adInk)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
